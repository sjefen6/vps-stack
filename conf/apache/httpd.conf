# Global server configuration
ServerName ${VPS_HOSTNAME}
ServerAdmin ${VPS_EMAIL_PUBLIC}

# Global logs — written to host-mounted directory alongside per-vhost logs
ErrorLog  "| /usr/local/bin/splitlog /var/log/apache2/sites/apache-error.log 10M 7"
CustomLog "| /usr/local/bin/splitlog /var/log/apache2/sites/apache-access.log 10M 7" vhost_combined

# Block access to sensitive directories and files
<DirectoryMatch "^(.*/)?\.git">
    Require all denied
</DirectoryMatch>

<FilesMatch "(^\.env|\.env\.|\.htpasswd|\.htaccess|composer\.(json|lock)|package(-lock)?\.json|webpack\.config\.js|Makefile|Dockerfile|docker-compose\.yml)$">
    Require all denied
</FilesMatch>
# Usage: Use HttpsRewrite
<Macro HttpsRewrite>
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</Macro>

# Macro: per-vhost logging with rotation (7 files x 10MB)
# Usage: Use VhostLog domain.name
<Macro VhostLog $domain>
    ErrorLog  "| /usr/bin/rotatelogs -n 7 /var/log/apache2/sites/$domain-error.log 10M"
    CustomLog "| /usr/bin/rotatelogs -n 7 /var/log/apache2/sites/$domain-access.log 10M" vhost_combined
</Macro>

# Macro: per-vhost logging via splitlog (stdout + rotated file, 7 x 10MB)
# Usage: Use VhostLogSplit domain.name
<Macro VhostLogSplit $domain>
    ErrorLog  "| /usr/local/bin/splitlog /var/log/apache2/sites/$domain-error.log 10M 7"
    CustomLog "| /usr/local/bin/splitlog /var/log/apache2/sites/$domain-access.log 10M 7" vhost_combined
</Macro>

# Macro: per-vhost logging to two locations with custom size and count for the second
# Usage: Use VhostLogSplitDual domain.name /second/error.log /second/access.log 50M 3
<Macro VhostLogSplitDual $domain $errlog $acclog $size $n>
    ErrorLog  "| /usr/local/bin/splitlog /var/log/apache2/sites/$domain-error.log 10M 7 $errlog $size $n"
    CustomLog "| /usr/local/bin/splitlog /var/log/apache2/sites/$domain-access.log 10M 7 $acclog $size $n" vhost_combined
</Macro>

# Macro: SSL certificate block
# Usage: Use SslCert certname
<Macro SslCert $certname>
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/$certname/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/$certname/privkey.pem
</Macro>

# Macro: standard document root with AllowOverride
# Usage: Use StdDir /path/to/docroot
<Macro StdDir $path>
    DocumentRoot $path
    <Directory $path>
        AllowOverride All
        Require all granted
    </Directory>
</Macro>
