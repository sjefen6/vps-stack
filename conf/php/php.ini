; ── Security ────────────────────────────────────────────────────────────────
expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off
zend.assertions = -1

; ── Uploads (bumped from old server's 2M) ───────────────────────────────────
post_max_size = 32M
upload_max_filesize = 32M

; ── Resources ────────────────────────────────────────────────────────────────
memory_limit = 256M
max_execution_time = 30

; ── Sessions ─────────────────────────────────────────────────────────────────
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; ── Remote file access (kept On — RSS feeds, remote APIs) ───────────────────
allow_url_fopen = On
